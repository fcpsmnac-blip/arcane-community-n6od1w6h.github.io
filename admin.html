<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Dashboard — ARCANE Community</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@latest/font/lucide.css">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
</head>
<body class="admin-body">

  <!-- Welcome Banner -->
  <div class="welcome-banner" id="welcomeBanner">
    <div class="container">
      <div class="welcome-inner">
        <span class="welcome-icon">✨</span>
        <div class="welcome-text">
          <h1 class="welcome-title">
            Welcome, <span id="welcomeUsername">User</span>
          </h1>
          <span class="welcome-role" id="welcomeRole" style="display:none;">(Role)</span>
          <p class="welcome-sub">Selamat datang di ARCANE Community</p>
        </div>
      </div>
    </div>
  </div>

  <aside class="admin-sidebar">
    <div class="admin-brand">
      <img src="assets/logo.png" alt="ARCANE" />
      <span>ARCANE</span>
    </div>

    <nav class="admin-nav">
      <button class="admin-nav-item active" data-tab="dashboard">
        <i class="lucide-layout-dashboard"></i> <span>Dashboard</span>
      </button>
      <button class="admin-nav-item" data-tab="news">
        <i class="lucide-newspaper"></i> <span>Berita</span>
      </button>
      <button class="admin-nav-item" data-tab="events">
        <i class="lucide-calendar-days"></i> <span>Acara</span>
      </button>
      <button class="admin-nav-item" data-tab="gallery">
        <i class="lucide-image"></i> <span>Galeri</span>
      </button>
      <button class="admin-nav-item" data-tab="settings">
        <i class="lucide-settings"></i> <span>Pengaturan</span>
      </button>
    </nav>

    <div class="admin-sidebar-footer">
      <a href="index.html" class="admin-btn-outline">
        <i class="lucide-external-link"></i> <span>Lihat Web</span>
      </a>
      <button class="admin-btn-outline danger" id="logoutBtn">
        <i class="lucide-log-out"></i> <span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <h1 id="pageTitle">Dashboard</h1>
      <div class="admin-user" id="adminUser"></div>
    </header>

    <section class="admin-tab active" id="tab-dashboard">
      <div class="stats-grid">
        <div class="stat-card">
          <i class="lucide-newspaper"></i>
          <div>
            <span class="stat-num" id="statNews">0</span>
            <span class="stat-label">Berita</span>
          </div>
        </div>
        <div class="stat-card">
          <i class="lucide-calendar-days"></i>
          <div>
            <span class="stat-num" id="statEvents">0</span>
            <span class="stat-label">Acara</span>
          </div>
        </div>
        <div class="stat-card">
          <i class="lucide-image"></i>
          <div>
            <span class="stat-num" id="statGallery">0</span>
            <span class="stat-label">Gambar</span>
          </div>
        </div>
      </div>
    </section>

    <section class="admin-tab" id="tab-news">
      <button class="btn btn-primary" id="addNewsBtn"><i class="lucide-plus"></i> Tambah Berita</button>
      <div class="admin-list" id="newsList"></div>
    </section>

    <section class="admin-tab" id="tab-events">
      <button class="btn btn-primary" id="addEventBtn"><i class="lucide-plus"></i> Tambah Acara</button>
      <div class="admin-list" id="eventsList"></div>
    </section>

    <section class="admin-tab" id="tab-gallery">
      <button class="btn btn-primary" id="addGalleryBtn"><i class="lucide-plus"></i> Upload Gambar</button>
      <div class="admin-gallery" id="galleryList"></div>
    </section>

    <section class="admin-tab" id="tab-settings">
      <p style="color:var(--text-mute);">Pengaturan situs — segera hadir.</p>
    </section>
  </main>

  <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Form</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <form id="modalForm" class="modal-form"></form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { firebaseConfig } from "./js/firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ROLE_DISPLAY = {
      owner:    'ArcZeyn',
      operator: 'Operator',
      member:   'Member'
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      const userDoc = await getDoc(doc(db, 'users', user.uid));
      const data = userDoc.exists() ? userDoc.data() : {};
      const role = data.role || 'member';

      if (role !== 'owner' && role !== 'admin') {
        alert('Akses ditolak. Halaman ini hanya untuk admin.');
        window.location.href = 'index.html';
        return;
      }

      const username = data.username || user.email.split('@')[0];
      const roleDisplay = ROLE_DISPLAY[role] || role;

      // Tampilkan info user di header
      document.getElementById('adminUser').textContent = `${username} (${roleDisplay})`;

      // Banner sambutan
      showWelcomeBanner(username, roleDisplay, role);
    });

    function showWelcomeBanner(username, roleDisplay, role) {
      const banner = document.getElementById('welcomeBanner');
      const usernameEl = document.getElementById('welcomeUsername');
      const roleEl = document.getElementById('welcomeRole');
      if (!banner) return;

      usernameEl.textContent = username;
      if (role === 'owner') {
        roleEl.style.display = 'none';
      } else {
        roleEl.textContent = `(${roleDisplay})`;
        roleEl.style.display = 'inline-block';
      }

      setTimeout(() => banner.classList.add('visible'), 100);
      setTimeout(() => {
        banner.classList.remove('visible');
        setTimeout(() => banner.remove(), 600);
      }, 3000);
    }

    document.getElementById('logoutBtn')?.addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = 'login.html';
    });
  </script>

  <script src="js/admin.js" type="module"></script>
</body>
</html>
